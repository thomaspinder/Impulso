[project]
name = "impulso"
version = "0.0.13"
description = "Bayesian Vector Autoregression (VAR) in Python."
authors = [{ name = "Thomas Pinder", email = "tompinder@live.co.uk" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.11,<4.0"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.3.3",
    # pydantic 2.0's pinned pydantic-core (2.0.1) has no wheels for Python
    # >= 3.12 and its source build fails on modern interpreters
    # (ForwardRef._evaluate signature change), so the floor is split by the
    # same family boundary as PyMC/ArviZ below. 2.5 is the first release
    # with official Python 3.12 support.
    "pydantic>=2.0; python_version < '3.12'",
    "pydantic>=2.5; python_version >= '3.12'",
    # PyMC and ArviZ must be pinned as a matched pair. PyMC 5 evaluates
    # `arviz.InferenceData` at import time, so it cannot import at all against
    # ArviZ >= 1 (which replaced InferenceData with xarray.DataTree); PyMC 6
    # requires arviz>=1.1 and, transitively, Python >= 3.12. Declaring the two
    # families independently would let a resolver pick PyMC 5 + ArviZ 1.
    "pymc>=5.26.1,<6; python_version < '3.12'",
    "arviz>=0.20,<1; python_version < '3.12'",
    "pymc>=6,<7; python_version >= '3.12'",
    "arviz>=1.1,<2; python_version >= '3.12'",
    # DataTree became a public xarray API in 2024.10; arviz-base 1.1 raises the
    # effective floor to 2024.11.
    "xarray>=2024.11",
    "matplotlib>=3.9",
    # 0.20 is the first release that resolves stringified forward references
    # in third-party generic superclasses against their defining module.
    # xarray's `Dataset(..., Mapping[Hashable, "DataArray"])` base trips the
    # old behaviour: under 0.18/0.19 any beartype-checked function returning
    # a non-empty Dataset raises BeartypeCallHintForwardRefException.
    "beartype>=0.20",
    "scipy>=1.10",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://thomaspinder.github.io/Impulso/"
Repository = "https://github.com/thomaspinder/impulso"
Documentation = "https://thomaspinder.github.io/Impulso/"

[project.optional-dependencies]
nutpie = ["nutpie>=0.13"]
diagnostics = ["statsmodels>=0.14.6"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "prek>=0.3.4",
    "tox-uv>=1.29.0",
    "ty>=0.0.14",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "jupyter>=1.0",
    "ipywidgets>=8.1.8",
    "nutpie>=0.13",
    "statsmodels>=0.14.6",
    "tabulate>=0.10.0",
    "typing-extensions>=4.12",
    "ipython>=8.18",
]
docs = [
    "statsmodels>=0.14.6",
    "sphinx>=8.1",
    "myst-nb>=1.2",
    "shibuya>=2024.10",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "sphinxcontrib-bibtex>=2.6",
    "sphinx-codeautolink>=0.15",
    "sphinx-sitemap>=2.6",
    "sphinxext-opengraph>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impulso"]

[tool.ty.src]
exclude = ["docs/**"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.11"

[tool.ty.rules]
# ArviZ InferenceData and PyMC distributions use dynamic attributes
# (__getattr__, symbolic ops) that static analysis cannot resolve.
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
# ArviZ 1 re-exports its public functions through a lazy module-level
# __getattr__, so even names that always exist look conditional to ty.
possibly-missing-attribute = "ignore"
# pandas type stubs on 3.10 reject list[str]/list[int] for index/columns
# params (expects Axes type), but this works fine at runtime.
invalid-argument-type = "ignore"
# PyMC timeseries distributions (GaussianRandomWalk, AR) are ABCMeta
# subclasses whose (name, *dist_params) constructor signature ty cannot
# match against the generic `type.__init__` overloads.
no-matching-overload = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that run MCMC sampling (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true
# Tutorials are jupytext py:percent notebooks, not library code.
extend-exclude = ["docs/tutorials/*.py"]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Long exception messages (common in Pydantic validators)
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Sphinx requires a module-level `copyright` variable (shadows a builtin).
"docs/conf.py" = ["A001"]
# One-shot migration tool: invokes the quarto/jupytext CLIs by name.
"scripts/qmd_to_myst.py" = ["S603", "S607"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]
