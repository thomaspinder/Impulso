version: 2

updates:
  # Python dependencies: pyproject.toml + uv.lock.
  #
  # Must be the `uv` ecosystem, not `pip`. Only `uv` re-resolves uv.lock; `pip`
  # would edit pyproject.toml and leave the lock stale, which fails CI because
  # .github/actions/setup-python-env installs with `uv sync --frozen`.
  # Covers [project.dependencies], [project.optional-dependencies] and the
  # PEP 735 [dependency-groups] tables (dev, docs).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00" # UTC
    # Two PRs per run, not one per dependency.
    #
    # Linters are separated because ty, ruff and prek are pre-1.0 and ship
    # new diagnostics in patch releases, while `quality` and
    # `tests-and-type-check` both gate on `uv run ty check`. Grouped with
    # everything else, one new rule blocks every runtime bump in the same PR
    # — #296 stalled a numpy fix for `np.linalg.svd(hermitian=True)`
    # returning non-unitary `vh` behind a ty 0.0.18 -> 0.0.65 jump.
    groups:
      linters:
        patterns:
          - "ty"
          - "ruff"
          - "prek"
      python:
        patterns:
          - "*"
        exclude-patterns:
          - "ty"
          - "ruff"
          - "prek"
    # impulso is a library, so its `>=` floors are a compatibility promise.
    # Land the bump in uv.lock and only touch a floor if it genuinely excludes
    # the new release.
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "build"
      include: "scope"

  # Workflow actions. A separate ecosystem, so necessarily a separate PR from
  # the Python one, but grouped so it is a single PR, not one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00" # UTC
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"
