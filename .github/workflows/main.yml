name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run prek checks
        uses: j178/prek-action@v2

      - name: Run remaining checks
        run: |
          echo "🚀 Checking lock file consistency with 'pyproject.toml'"
          uv lock --locked
          echo "🚀 Static type checking: Running ty"
          uv run ty check

  tests-and-type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Report the resolved PyMC/ArviZ pair
        # The two families are pinned by Python marker, so this line is the
        # quickest way to see which stack a matrix leg actually exercised.
        run: |
          uv run --no-sync python -c "
          import importlib.metadata as m
          print('pymc', m.version('pymc'), '| arviz', m.version('arviz'), '| xarray', m.version('xarray'))
          "

      - name: Reject the removed arviz.InferenceData shim at import time
        # ArviZ 1 keeps `arviz.InferenceData` alive only behind a
        # MigrationWarning-emitting shim, so an evaluated annotation would make
        # every `import impulso` warn (issue #273). Only that warning is
        # promoted to an error; unrelated warnings stay warnings.
        if: ${{ matrix.python-version != '3.11' }}
        run: |
          uv run --no-sync python -c "
          import warnings, arviz as az
          warnings.simplefilter('error', az.MigrationWarning)
          import impulso
          print('import impulso: no MigrationWarning')
          "

      - name: Run tests (fast; MCMC-marked tests run in slow-tests.yml)
        run: uv run python -m pytest tests -m "not slow" --cov --cov-branch --cov-config=pyproject.toml --cov-report=xml

      - name: Check typing
        run: uv run ty check

      - name: Upload coverage reports to Codecov with GitHub Action on Python 3.11
        uses: codecov/codecov-action@v7
        if: ${{ matrix.python-version == '3.11' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lowest-direct-deps:
    # The lockfile pins the newest compatible release of everything, so the
    # matrix above never exercises the floors declared in pyproject.toml. This
    # job resolves every direct dependency down to its declared minimum, so a
    # floor that is only nominally supported fails here instead of in a
    # downstream install. PyMC/ArviZ are declared as two Python-marked
    # families, so both floors need a leg: 3.11 pins the PyMC 5 / ArviZ 0
    # floor and 3.12 pins the PyMC 6 / ArviZ 1 floor.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve every dependency floor to its minimum
        # Rewrites uv.lock in the runner's checkout; the committed lockfile is
        # verified separately by the `quality` job's `uv lock --locked`.
        run: >
          uv sync --python ${{ matrix.python-version }} --resolution lowest-direct
          --group dev --extra nutpie --extra diagnostics

      - name: Report the resolved floors
        run: |
          uv run --no-sync python -c "
          import importlib.metadata as m
          for p in ['numpy','pandas','pydantic','pymc','arviz','xarray','matplotlib','beartype','scipy','nutpie','statsmodels']:
              print(f'{p:14}{m.version(p)}')
          "

      - name: Assert the floor resolved to the expected PyMC/ArviZ family
        run: |
          uv run --no-sync python -c "
          import importlib.metadata as m
          pymc_major = int(m.version('pymc').split('.')[0])
          arviz_major = int(m.version('arviz').split('.')[0])
          expected = (5, 0) if '${{ matrix.python-version }}' == '3.11' else (6, 1)
          got = (pymc_major, arviz_major)
          assert got == expected, f'expected PyMC/ArviZ majors {expected}, got {got}'
          print('floor family OK:', got)
          "

      - name: Run tests against the floors
        run: uv run --no-sync python -m pytest tests -m "not slow"

  arviz-1-2-compat:
    # The modern family is declared as `arviz>=1.1,<2`, so the lockfile alone
    # does not prove that a specific later release still works. Downstream
    # projects (notably pymc-marketing) track ArviZ 1.2+, so constrain this leg
    # to it explicitly rather than inferring support from the broad range.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Install with ArviZ constrained to >=1.2,<2
        run: |
          uv sync --python 3.12 --group dev --extra nutpie --extra diagnostics
          uv pip install --python 3.12 "arviz>=1.2,<2"

      - name: Assert the constrained version really is >=1.2,<2
        run: |
          uv run --no-sync python -c "
          from importlib.metadata import version
          v = tuple(int(p) for p in version('arviz').split('.')[:2])
          assert (1, 2) <= v < (2, 0), f'expected arviz >=1.2,<2, got {version(\"arviz\")}'
          print('arviz', version('arviz'))
          "

      - name: Run tests against ArviZ 1.2+
        run: uv run --no-sync python -m pytest tests -m "not slow"

  wheel-install:
    # Editable installs resolve straight from the source tree, so they never
    # validate the published metadata — including the Python-marked PyMC/ArviZ
    # pairs. Build the wheel once and install it into clean legacy and modern
    # environments to prove a real `pip install impulso` picks a valid stack.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the wheel
        run: uv build --wheel

      - name: Install the wheel into a clean environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-wheel
          uv pip install --python .venv-wheel dist/*.whl

      - name: Smoke-test the installed wheel
        run: |
          .venv-wheel/bin/python -c "
          import importlib.metadata as m
          import impulso
          print('impulso', impulso.__name__, '| pymc', m.version('pymc'), '| arviz', m.version('arviz'))
          for name in ['VAR', 'VARData', 'FittedVAR', 'IdentifiedVAR', 'ForecastResult', 'Cholesky']:
              assert getattr(impulso, name) is not None, name
          from impulso._arviz_compat import ARVIZ_V1, InferenceDataLike
          expected_v1 = '${{ matrix.python-version }}' != '3.11'
          assert ARVIZ_V1 is expected_v1, (ARVIZ_V1, expected_v1)
          print('active container:', InferenceDataLike.__name__)
          "

  build-docs:
    runs-on: ubuntu-latest
    # Full render on main executes real MCMC; smoke render on PRs is fast.
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          # Pinned to the legacy stack: the tutorials still call ArviZ 0 APIs
          # (plot_ppc, plot_trace, hdi_prob=, .extend()). Their migration is
          # tracked separately; the API reference is generated from source,
          # which is already dual-stack.
          python-version: "3.11"

      - name: Install docs dependencies
        run: uv sync --frozen --group docs

      - name: Register Jupyter kernel
        run: uv run python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Restore notebook execution cache
        # Unique key per run so the cache is ALWAYS re-saved (actions/cache
        # refuses to overwrite an existing key). Combined with jupyter-cache's
        # own content-hash invalidation, this makes the cache accumulate every
        # successfully executed notebook instead of freezing partial progress.
        uses: actions/cache@v6
        with:
          path: |
            docs/_build/.jupyter_cache
            docs/_build/.jupyter_cache_ci
          key: jupyter-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jupyter-cache-

      - name: Build documentation
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Production build: full-fidelity render (real MCMC), resilient."
            # Not -W here: the deploy must not be blocked by a warning or a
            # single slow/failed MCMC notebook. Cached notebooks render real
            # figures; anything that fails execution renders an error cell but
            # the site still deploys. The PR build below stays strict.
            IMPULSO_DOCS_RESILIENT=1 uv run sphinx-build --keep-going -b html docs docs/_build/html
          else
            echo "PR build: fast smoke render (strict)."
            make docs-ci
          fi

      - name: Upload docs artifact (production, full render only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

      - name: Upload smoke-render artifact for PR review
        # Plain artifact, downloadable from the run page. NEVER a Pages
        # artifact: GitHub Pages "preview" deployments are unsupported on
        # this plan and silently deploy to the production URL, which is how
        # smoke renders kept replacing the published docs.
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-smoke-render
          path: docs/_build/html
          retention-days: 7

  docs-linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          # Same legacy pin as build-docs, for the same reason.
          python-version: "3.11"

      - name: Install docs dependencies
        run: uv sync --frozen --group docs

      - name: Check external links (no notebook execution)
        run: uv run --group docs sphinx-build -b linkcheck -D nb_execution_mode=off docs docs/_build/linkcheck

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, tests-and-type-check, build-docs]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
